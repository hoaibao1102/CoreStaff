    <text x="1270" y="285" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">HR / Payroll</text>
    <text x="1270" y="300" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">(Nhân sự &amp; Lương)</text>
  </g>
  <!-- HR Links -->
  <line x1="1245" y1="210" x2="905" y2="175" stroke="#1e293b" stroke-width="1.4" />
