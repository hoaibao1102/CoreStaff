  <line x1="1245" y1="280" x2="905" y2="655" stroke="#1e293b" stroke-width="1.4" />

  <!-- 3. Department Manager (Bottom Left) -->
  <g id="actor-manager">
    <circle cx="100" cy="620" r="14" fill="#ffedd5" stroke="#1e293b" stroke-width="2" />
    <line x1="100" y1="634" x2="100" y2="670" stroke="#1e293b" stroke-width="2" />
    <line x1="78" y1="646" x2="122" y2="646" stroke="#1e293b" stroke-width="2" />
