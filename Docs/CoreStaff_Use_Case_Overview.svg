  <!-- Bottom Legend Bar -->
  <rect x="235" y="830" width="910" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="250" y="852" font-size="11.5" font-weight="800" fill="#1e293b">💡 NGUYÊN LÝ THIẾT KẾ KIẾN TRÚC CORESTAFF (BASELINE SRS v4.0):</text>
  <text x="250" y="872" font-size="10" fill="#475569">1. <b style="color:#b91c1c;">Chốt công &amp; Snapshot:</b> Timesheet đóng sẽ sinh ra PayrollInputSnapshot bất biến. Bảng lương CHỈ đọc snapshot, không bao giờ đọc trực tiếp live attendance.</text>
  <text x="250" y="890" font-size="10" fill="#475569">2. <b style="color:#b91c1c;">Nghỉ phép 3 bước (D04):</b> Employee gửi LeaveRequest → Department Manager phê duyệt (đúng scope, không tự duyệt) → HR ghi nhận &amp; apply vào ngày công.</text>
  <text x="250" y="908" font-size="10" fill="#475569">3. <b style="color:#1d4ed8;">Tăng ca tự động (D01):</b> Nhân viên chỉ đăng ký giờ và lý do; Backend tự động phân loại OT ngày thường/nghỉ tuần/lễ. Chấm công quản lý phút; Lương tính tiền OT.</text>
  <text x="250" y="926" font-size="10" fill="#475569">4. <b style="color:#065f46;">Quyền riêng tư lương:</b> Quản lý chỉ xem phiếu lương cá nhân của chính mình. Phiếu lương chỉ hiển thị tới nhân viên sau khi HR đã Khóa lương (LOCKED).</text>
</svg>
