    <text x="100" y="270" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">(Quản trị nền tảng)</text>
  </g>
  <!-- SysAdmin Links -->
  <line x1="125" y1="175" x2="250" y2="180" stroke="#1e293b" stroke-width="1.4" />
  <line x1="125" y1="185" x2="470" y2="180" stroke="#1e293b" stroke-width="1.4" />
  <line x1="125" y1="195" x2="355" y2="270" stroke="#1e293b" stroke-width="1.4" />

