  <line x1="905" y1="655" x2="930" y2="655" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#openArrowBlue)" />
  <text x="918" y="650" font-size="9.5" font-style="italic" fill="#1d4ed8" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- OT and Payroll reading Policy -->
  <path d="M 440 655 C 500 720, 680 400, 715 270" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <path d="M 810 630 C 810 500, 810 350, 810 290" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="825" y="440" font-size="9.5" font-style="italic" fill="#059669" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>


  <!-- ================= 4 EXTERNAL ACTORS ================= -->
  <!-- 1. System Admin (Top Left) -->
  <g id="actor-sysadmin">
    <circle cx="100" cy="150" r="14" fill="#ffedd5" stroke="#1e293b" stroke-width="2" />
    <line x1="100" y1="164" x2="100" y2="200" stroke="#1e293b" stroke-width="2" />
    <line x1="78" y1="176" x2="122" y2="176" stroke="#1e293b" stroke-width="2" />
    <line x1="100" y1="200" x2="82" y2="235" stroke="#1e293b" stroke-width="2" />
