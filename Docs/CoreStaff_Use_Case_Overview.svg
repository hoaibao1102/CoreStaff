    <circle cx="1270" cy="180" r="14" fill="#ffedd5" stroke="#1e293b" stroke-width="2" />
    <line x1="1270" y1="194" x2="1270" y2="230" stroke="#1e293b" stroke-width="2" />
    <line x1="1248" y1="206" x2="1292" y2="206" stroke="#1e293b" stroke-width="2" />
