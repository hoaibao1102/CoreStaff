<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 980" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="pkgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="pkgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="pkgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="pkgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="ucGradCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="ucGradRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>

    <marker id="openArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="#1e293b" stroke-width="1.6" />
    </marker>
    <marker id="openArrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Frame Canvas -->
  <rect x="12" y="12" width="1356" height="956" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="4" />
  <polygon points="12,12 290,12 310,38 12,38" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="22" y="30" font-size="13" font-weight="700" fill="#0f172a">uc CoreStaff Use Cases Overview v4.0</text>

  <text x="690" y="42" font-size="17" font-weight="900" fill="#0f172a" text-anchor="middle">SƠ ĐỒ CA SỬ DỤNG TỔNG HỢP TOÀN HỆ THỐNG (COMPREHENSIVE USE CASE OVERVIEW)</text>
  <text x="690" y="60" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Kiến trúc 4 Phân hệ Nghiệp vụ • 4 Nhóm Tác nhân • Ràng buộc Toàn vẹn Chấm công &amp; Tiền lương</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="220" y="75" width="940" height="880" fill="#fafafa" stroke="#334155" stroke-width="2" rx="10" />
  <text x="690" y="100" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">System Boundary: CoreStaff Platform (Human Resource, Attendance &amp; Payroll)</text>

  <!-- PACKAGE 1: PLATFORM & AUTH -->
  <rect x="235" y="115" width="445" height="225" rx="8" fill="url(#pkgGrad1)" stroke="#cbd5e1" stroke-width="1.4" />
  <text x="250" y="135" font-size="12" font-weight="800" fill="#475569">📦 PHÂN HỆ 1: NỀN TẢNG &amp; XÁC THỰC</text>

  <ellipse cx="340" cy="180" rx="90" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="340" y="178" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Đăng nhập &amp; Hồ sơ cá nhân</text>
  <text x="340" y="191" font-size="9" fill="#475569" text-anchor="middle">(AUTH: Login / Profile / Password)</text>

  <ellipse cx="560" cy="180" rx="90" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="560" y="178" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Quản lý Organization</text>
  <text x="560" y="191" font-size="9" fill="#475569" text-anchor="middle">(ORG: Create Org / Provision HR)</text>

  <ellipse cx="450" cy="270" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="450" y="268" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Nhật ký kiểm toán (Audit Log)</text>
  <text x="450" y="281" font-size="9" fill="#475569" text-anchor="middle">(AUDIT: Platform &amp; Tenant History)</text>


  <!-- PACKAGE 2: HR CORE & CONTRACTS -->
  <rect x="700" y="115" width="445" height="340" rx="8" fill="url(#pkgGrad2)" stroke="#a7f3d0" stroke-width="1.4" />
  <text x="715" y="135" font-size="12" font-weight="800" fill="#065f46">📦 PHÂN HỆ 2: NHÂN SỰ, HỢP ĐỒNG &amp; CHÍNH SÁCH</text>

  <ellipse cx="810" cy="175" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="810" y="173" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Quản lý Nhân sự &amp; Cơ cấu</text>
  <text x="810" y="186" font-size="9" fill="#475569" text-anchor="middle">(PEOPLE: Employee/Dept/Position)</text>

  <ellipse cx="1025" cy="175" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="1025" y="173" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Hợp đồng &amp; Tài liệu bảo mật</text>
  <text x="1025" y="186" font-size="9" fill="#475569" text-anchor="middle">(CONTRACT: Probation ≥85%, Docs)</text>

  <ellipse cx="810" cy="265" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="810" y="263" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Chính sách Luật, OT &amp; Thuế</text>
  <text x="810" y="276" font-size="9" fill="#475569" text-anchor="middle">(POLICY: Labor/OT/Insurance/Tax)</text>

  <ellipse cx="1025" cy="265" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="1025" y="263" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Lương, Phụ cấp &amp; KPI</text>
  <text x="1025" y="276" font-size="9" fill="#475569" text-anchor="middle">(COMP: Salary, Allowance, KPI Draft/Confirm)</text>

  <ellipse cx="920" cy="355" rx="100" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="920" y="352" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Cấu hình ca Full-time &amp; Lịch</text>
  <text x="920" y="366" font-size="9" fill="#475569" text-anchor="middle">(SCHEDULE: ShiftTemplate &amp; Calendar)</text>


  <!-- PACKAGE 3: ATTENDANCE & OVERTIME -->
  <rect x="235" y="475" width="445" height="340" rx="8" fill="url(#pkgGrad3)" stroke="#fed7aa" stroke-width="1.4" />
  <text x="250" y="495" font-size="12" font-weight="800" fill="#9a3412">📦 PHÂN HỆ 3: CHẤM CÔNG, NGHỈ PHÉP &amp; TĂNG CA</text>

  <ellipse cx="345" cy="545" rx="95" ry="25" fill="url(#ucGradRed)" stroke="#b91c1c" stroke-width="1.8" filter="url(#shadow)" />
  <text x="345" y="542" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">Chấm công In / Out</text>
  <text x="345" y="556" font-size="9" fill="#7f1d1d" text-anchor="middle">(ATT: Network / GPS / Selfie)</text>

  <ellipse cx="565" cy="545" rx="95" ry="25" fill="url(#ucGradRed)" stroke="#b91c1c" stroke-width="1.8" filter="url(#shadow)" />
  <text x="565" y="542" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">Nghỉ phép: Submit→Approve→Apply</text>
  <text x="565" y="556" font-size="9" fill="#7f1d1d" text-anchor="middle">(LEAVE: Paid / Unpaid Override)</text>

  <ellipse cx="345" cy="655" rx="95" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="345" y="652" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Đăng ký &amp; Tự phân loại OT</text>
  <text x="345" y="666" font-size="9" fill="#475569" text-anchor="middle">(OT: Auto classify Working/Off/Holiday)</text>

  <ellipse cx="565" cy="655" rx="95" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="565" y="652" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Duyệt ngoại lệ &amp; Điều chỉnh</text>
  <text x="565" y="666" font-size="9" fill="#475569" text-anchor="middle">(APPROVAL: Selfie, Clarify, Adjust)</text>


  <!-- PACKAGE 4: TIMESHEET & PAYROLL -->
  <rect x="700" y="475" width="445" height="340" rx="8" fill="url(#pkgGrad4)" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="715" y="495" font-size="12" font-weight="800" fill="#1e40af">📦 PHÂN HỆ 4: CHỐT CÔNG &amp; TIỀN LƯƠNG</text>

  <ellipse cx="810" cy="545" rx="95" ry="25" fill="url(#ucGradRed)" stroke="#b91c1c" stroke-width="1.8" filter="url(#shadow)" />
  <text x="810" y="542" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">Rà soát &amp; Chốt kỳ công</text>
  <text x="810" y="556" font-size="9" fill="#7f1d1d" text-anchor="middle">(TIMESHEET: Blockers, Close Period)</text>

  <ellipse cx="1025" cy="545" rx="95" ry="25" fill="url(#ucGradCore)" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)" />
  <text x="1025" y="542" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Sinh Snapshot bất biến</text>
  <text x="1025" y="556" font-size="9" fill="#1e3a8a" text-anchor="middle">(SNAPSHOT: PayrollInputSnapshot)</text>

  <ellipse cx="810" cy="655" rx="95" ry="25" fill="url(#ucGradCore)" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)" />
  <text x="810" y="652" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Tính, Review &amp; Khóa lương</text>
  <text x="810" y="666" font-size="9" fill="#1e3a8a" text-anchor="middle">(PAYROLL: Gross, BHXH, PIT, Net)</text>

  <ellipse cx="1025" cy="655" rx="95" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="1025" y="652" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Phát hành phiếu lương</text>
  <text x="1025" y="666" font-size="9" fill="#475569" text-anchor="middle">(PAYSLIP: Release upon LOCKED)</text>


  <!-- INTRA-SYSTEM INCLUDES (Crucial architectural dependencies) -->
  <line x1="905" y1="545" x2="930" y2="545" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#openArrowBlue)" />
  <line x1="1025" y1="570" x2="885" y2="640" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#openArrowBlue)" />
