<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="ucGradKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <marker id="openArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="#1e293b" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="1036" height="736" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="4" />
  <polygon points="12,12 280,12 300,38 12,38" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="22" y="30" font-size="13" font-weight="700" fill="#0f172a">uc Department Manager Use Cases</text>

  <!-- System Boundary -->
  <rect x="230" y="55" width="790" height="675" fill="#fafafa" stroke="#334155" stroke-width="1.8" rx="8" />
  <text x="625" y="85" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">System Boundary: CoreStaff Department Attendance &amp; Approval</text>

  <!-- STICK FIGURE: DEPARTMENT MANAGER -->
  <g id="actor-manager">
    <circle cx="110" cy="340" r="16" fill="#ffedd5" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="356" x2="110" y2="405" stroke="#1e293b" stroke-width="2" />
    <line x1="82" y1="370" x2="138" y2="370" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="405" x2="88" y2="450" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="405" x2="132" y2="450" stroke="#1e293b" stroke-width="2" />
    <text x="110" y="475" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">Department Manager</text>
    <text x="110" y="493" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">(Quản lý phòng ban)</text>
    <text x="110" y="510" font-size="10" font-style="italic" fill="#94a3b8" text-anchor="middle">«Dùng chung 1 tài khoản»</text>
  </g>

  <!-- Associations -->
  <line x1="138" y1="350" x2="310" y2="125" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="365" x2="310" y2="210" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="380" x2="310" y2="340" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="395" x2="310" y2="425" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="410" x2="310" y2="510" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="425" x2="310" y2="595" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="440" x2="310" y2="675" stroke="#1e293b" stroke-width="1.6" />

  <!-- USE CASES -->
  <!-- 1. Personal Attendance (My Work) -->
  <ellipse cx="420" cy="125" rx="100" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="122" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Chấm công "Công của tôi"</text>
  <text x="420" y="137" font-size="10" fill="#475569" text-anchor="middle">(Personal Check-in/out via Assignment)</text>

  <!-- 2. Attendance Approval (Main with sub cases) -->
  <ellipse cx="420" cy="210" rx="105" ry="28" fill="url(#ucGradKey)" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="206" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Duyệt ngoại lệ chấm công</text>
  <text x="420" y="222" font-size="10" fill="#7f1d1d" text-anchor="middle">(Approve Attendance Exceptions)</text>

  <!-- Sub UCs of Approval -->
  <ellipse cx="780" cy="135" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="780" y="133" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Xem Selfie &amp; Tọa độ GPS</text>
  <text x="780" y="146" font-size="9.5" fill="#475569" text-anchor="middle">(Inspect Evidence &amp; Geofence)</text>

  <ellipse cx="780" cy="195" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="780" y="193" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Yêu cầu nhân viên giải trình</text>
  <text x="780" y="206" font-size="9.5" fill="#475569" text-anchor="middle">(Request Clarification)</text>

  <ellipse cx="780" cy="255" rx="95" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="780" y="253" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Từ chối kèm lý do bắt buộc</text>
  <text x="780" y="266" font-size="9.5" fill="#475569" text-anchor="middle">(Reject with Mandatory Reason)</text>

  <line x1="520" y1="198" x2="685" y2="145" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="595" y="165" font-size="9.5" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="685" y1="200" x2="525" y2="210" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="605" y="200" font-size="9.5" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <line x1="685" y1="250" x2="520" y2="222" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="600" y="246" font-size="9.5" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- 3. Leave Request Approval (D04 update) -->
  <ellipse cx="420" cy="340" rx="105" ry="28" fill="url(#ucGradKey)" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="336" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Duyệt đơn nghỉ phép phòng</text>
  <text x="420" y="352" font-size="10" fill="#7f1d1d" text-anchor="middle">(Review LeaveRequest: Paid/Unpaid)</text>

  <!-- 4. Overtime Approval (Window only) -->
  <ellipse cx="420" cy="425" rx="105" ry="28" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="421" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Duyệt khung giờ OT</text>
  <text x="420" y="437" font-size="10" fill="#475569" text-anchor="middle">(Approve Overtime Window)</text>

  <!-- 5. Adjustment Request Approval (Before closing) -->
  <ellipse cx="420" cy="510" rx="105" ry="28" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="506" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Duyệt điều chỉnh trước chốt kỳ</text>
  <text x="420" y="522" font-size="10" fill="#475569" text-anchor="middle">(Review Adjustment Before Close)</text>

  <!-- 6. Confirm Department Timesheet -->
  <ellipse cx="420" cy="595" rx="105" ry="28" fill="url(#ucGradKey)" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="591" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">Xác nhận bảng công phòng</text>
  <text x="420" y="607" font-size="10" fill="#1e3a8a" text-anchor="middle">(Confirm Department Timesheet)</text>

  <!-- 7. Evaluate Department KPI (Manager draft; HR confirms) -->
  <ellipse cx="420" cy="675" rx="100" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="672" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Đánh giá KPI nhân sự phòng</text>
  <text x="420" y="687" font-size="10" fill="#475569" text-anchor="middle">(Draft KPI; HR Confirms)</text>

  <!-- Note Box for Manager Rules -->
  <g filter="url(#shadow)">
    <rect x="630" y="380" width="370" height="250" rx="8" fill="url(#noteGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <text x="645" y="405" font-size="11.5" font-weight="800" fill="#854d0e">🛡️ NGUYÊN TẮC BẢO VỆ &amp; PHẠM VI QUẢN LÝ:</text>
    <text x="645" y="427" font-size="10.5" font-weight="700" fill="#b45309">1. Ràng buộc tự duyệt (No Self-Approval):</text>
    <text x="655" y="445" font-size="10" fill="#713f12">• Quản lý KHÔNG được tự duyệt Selfie, Leave, OT</text>
    <text x="655" y="460" font-size="10" fill="#713f12">  hoặc đơn điều chỉnh công của chính mình.</text>
    <text x="655" y="475" font-size="10" fill="#713f12">• Request chuyển cho HR hoặc ủy quyền (Delegation).</text>
    
    <text x="645" y="497" font-size="10.5" font-weight="700" fill="#b45309">2. Quyền riêng tư lương (Payroll Privacy):</text>
    <text x="655" y="515" font-size="10" fill="#713f12">• Chỉ xem phiếu lương cá nhân của chính mình.</text>
    <text x="655" y="530" font-size="10" fill="#713f12">• KHÔNG được xem dữ liệu tiền lương của phòng ban.</text>

    <text x="645" y="552" font-size="10.5" font-weight="700" fill="#b45309">3. Phân cấp nghỉ phép (D04):</text>
    <text x="655" y="570" font-size="10" fill="#713f12">• Quản lý chỉ Approve/Reject đơn phép;</text>
    <text x="655" y="585" font-size="10" fill="#713f12">• HR là người thực hiện Apply vào ngày công.</text>
    <text x="655" y="605" font-size="9.5" font-style="italic" fill="#854d0e">→ Xác nhận phòng ban bị mất hiệu lực nếu có thay đổi công.</text>
  </g>
</svg>
