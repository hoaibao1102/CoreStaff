<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="ucGradKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <marker id="openArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="#1e293b" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="1096" height="836" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="4" />
  <polygon points="12,12 250,12 270,38 12,38" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="22" y="30" font-size="13" font-weight="700" fill="#0f172a">uc Employee Use Cases</text>

  <!-- System Boundary -->
  <rect x="230" y="55" width="855" height="775" fill="#fafafa" stroke="#334155" stroke-width="1.8" rx="8" />
  <text x="657" y="85" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">System Boundary: CoreStaff Employee Self-Service &amp; Attendance</text>

  <!-- STICK FIGURE: EMPLOYEE -->
  <g id="actor-employee">
    <circle cx="110" cy="410" r="16" fill="#ffedd5" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="426" x2="110" y2="475" stroke="#1e293b" stroke-width="2" />
    <line x1="82" y1="440" x2="138" y2="440" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="475" x2="88" y2="520" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="475" x2="132" y2="520" stroke="#1e293b" stroke-width="2" />
    <text x="110" y="545" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">Employee</text>
    <text x="110" y="563" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">(Nhân viên)</text>
    <text x="110" y="580" font-size="10" font-style="italic" fill="#94a3b8" text-anchor="middle">«Mobile-first web»</text>
  </g>

  <!-- Associations -->
  <line x1="138" y1="410" x2="310" y2="120" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="425" x2="305" y2="200" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="440" x2="305" y2="330" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="455" x2="310" y2="465" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="470" x2="310" y2="535" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="485" x2="310" y2="605" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="500" x2="310" y2="675" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="515" x2="310" y2="745" stroke="#1e293b" stroke-width="1.6" />

  <!-- USE CASES -->
  <!-- 1. Login & Profile -->
  <ellipse cx="420" cy="120" rx="105" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="117" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Đăng nhập &amp; Hồ sơ cá nhân</text>
  <text x="420" y="132" font-size="10" fill="#475569" text-anchor="middle">(Login, Change Password, Profile)</text>

  <!-- 2. Check-in/out at Office (Network/GPS) -->
  <ellipse cx="420" cy="200" rx="110" ry="28" fill="url(#ucGradKey)" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="196" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Chấm công tại văn phòng</text>
  <text x="420" y="212" font-size="10" fill="#7f1d1d" text-anchor="middle">(IN_OFFICE: Network / GPS)</text>

  <ellipse cx="800" cy="160" rx="100" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="800" y="158" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Xác thực WiFi / GPS Geofence</text>
  <text x="800" y="171" font-size="9.5" fill="#475569" text-anchor="middle">(Public IP / Haversine Distance)</text>

  <ellipse cx="800" cy="220" rx="100" ry="24" fill="url(#ucGrad)" stroke="#ca8a04" stroke-width="1.6" filter="url(#shadow)" />
  <text x="800" y="218" font-size="11.5" font-weight="700" fill="#854d0e" text-anchor="middle">Selfie Fallback khi lỗi mạng</text>
  <text x="800" y="231" font-size="9.5" fill="#713f12" text-anchor="middle">(Policy Allowed Fallback)</text>

  <line x1="520" y1="188" x2="705" y2="168" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="615" y="172" font-size="9.5" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="705" y1="215" x2="525" y2="208" stroke="#ca8a04" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="615" y="222" font-size="9.5" font-style="italic" fill="#854d0e" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- 3. Check-in/out Remote (Selfie + GPS) -->
  <ellipse cx="420" cy="330" rx="110" ry="28" fill="url(#ucGradKey)" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="326" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Chấm công ngoài văn phòng</text>
  <text x="420" y="342" font-size="10" fill="#7f1d1d" text-anchor="middle">(OUT_OFFICE: Selfie + GPS)</text>

  <ellipse cx="800" cy="285" rx="100" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="800" y="283" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Chụp Selfie trực tiếp bằng Camera</text>
  <text x="800" y="296" font-size="9.5" fill="#475569" text-anchor="middle">(Live Capture, File Validation)</text>

  <ellipse cx="800" cy="345" rx="100" ry="24" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)" />
  <text x="800" y="343" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Tự động tạo ApprovalRequest</text>
  <text x="800" y="356" font-size="9.5" fill="#475569" text-anchor="middle">(Pending Manager Approval)</text>

  <line x1="520" y1="318" x2="705" y2="295" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="615" y="300" font-size="9.5" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="525" y1="335" x2="700" y2="345" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#openArrow)" />
  <text x="615" y="350" font-size="9.5" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- 4. Submit Leave Request (Full Day Paid/Unpaid) -->
  <ellipse cx="420" cy="465" rx="105" ry="26" fill="url(#ucGradKey)" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="462" font-size="12.5" font-weight="800" fill="#991b1b" text-anchor="middle">Gửi đơn nghỉ phép (Leave)</text>
  <text x="420" y="477" font-size="9.5" fill="#7f1d1d" text-anchor="middle">(PAID_LEAVE / UNPAID_LEAVE)</text>

  <!-- 5. Submit Overtime Request -->
  <ellipse cx="420" cy="535" rx="105" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="532" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Đăng ký làm thêm giờ (OT)</text>
  <text x="420" y="547" font-size="9.5" fill="#475569" text-anchor="middle">(Submit Window &amp; Reason)</text>

  <!-- 6. Submit Adjustment Request (Before Closing) -->
  <ellipse cx="420" cy="605" rx="105" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="602" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Gửi yêu cầu điều chỉnh công</text>
  <text x="420" y="617" font-size="9.5" fill="#475569" text-anchor="middle">(Adjustment Before Close)</text>

  <!-- 7. View Attendance History & Timesheet -->
  <ellipse cx="420" cy="675" rx="105" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="672" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Xem lịch sử công &amp; Timesheet</text>
  <text x="420" y="687" font-size="9.5" fill="#475569" text-anchor="middle">(History, Working/Late/Early)</text>

  <!-- 8. View & Download Payslip -->
  <ellipse cx="420" cy="745" rx="105" ry="26" fill="url(#ucGradKey)" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)" />
  <text x="420" y="742" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">Xem phiếu lương cá nhân</text>
  <text x="420" y="757" font-size="9.5" fill="#1e3a8a" text-anchor="middle">(View Payslip on LOCKED status)</text>

  <!-- Side Note on Business Rules -->
  <g filter="url(#shadow)">
    <rect x="670" y="440" width="390" height="280" rx="8" fill="url(#noteGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <text x="685" y="465" font-size="11.5" font-weight="800" fill="#854d0e">📱 QUY CHUẨN CHẤM CÔNG NHÂN VIÊN (SRS v4.0):</text>
    <text x="685" y="487" font-size="10" font-weight="700" fill="#b45309">1. Ràng buộc ngày công (BR-DAY / BR-ORDER):</text>
    <text x="695" y="504" font-size="9.5" fill="#713f12">• 1 ngày = 1 AttendanceDay duy nhất.</text>
    <text x="695" y="519" font-size="9.5" fill="#713f12">• Check-out bắt buộc phải có Check-in trước.</text>
    <text x="695" y="534" font-size="9.5" fill="#713f12">• Work mode (IN_OFFICE/OUT_OFFICE) cố định cả ngày.</text>

    <text x="685" y="556" font-size="10" font-weight="700" fill="#b45309">2. Chống gian lận &amp; Idempotency:</text>
    <text x="695" y="573" font-size="9.5" fill="#713f12">• Thời gian tính theo Server time (backend database).</text>
    <text x="695" y="588" font-size="9.5" fill="#713f12">• Backend tự kiểm tra IP/GPS; không tin client.</text>
    <text x="695" y="603" font-size="9.5" fill="#713f12">• Header Idempotency-Key chống gửi đúp bản ghi.</text>

    <text x="685" y="625" font-size="10" font-weight="700" fill="#b45309">3. Đăng ký Overtime tự động phân loại (BR-OT-01):</text>
    <text x="695" y="642" font-size="9.5" fill="#713f12">• Nhân viên KHÔNG tự chọn loại OT.</text>
    <text x="695" y="657" font-size="9.5" fill="#713f12">• Hệ thống tự xác định: Ngày thường / Nghỉ tuần / Lễ</text>
    <text x="695" y="672" font-size="9.5" fill="#713f12">  dựa trên WorkSchedule và Calendar.</text>
    <text x="695" y="692" font-size="9" font-style="italic" fill="#854d0e">→ Payslip chỉ hiển thị khi HR đã duyệt Khóa bảng lương (LOCKED).</text>
  </g>
</svg>
