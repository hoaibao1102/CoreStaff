<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <marker id="openArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="#1e293b" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="956" height="626" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="4" />
  <polygon points="12,12 240,12 258,38 12,38" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="22" y="30" font-size="13" font-weight="700" fill="#0f172a">uc System Admin Use Cases</text>

  <!-- System Boundary -->
  <rect x="230" y="55" width="715" height="560" fill="#fafafa" stroke="#334155" stroke-width="1.8" rx="8" />
  <text x="587" y="85" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">System Boundary: CoreStaff Platform Administration</text>

  <!-- STICK FIGURE: SYSTEM ADMIN -->
  <g id="actor-admin">
    <circle cx="110" cy="270" r="16" fill="#ffedd5" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="286" x2="110" y2="335" stroke="#1e293b" stroke-width="2" />
    <line x1="82" y1="300" x2="138" y2="300" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="335" x2="88" y2="380" stroke="#1e293b" stroke-width="2" />
    <line x1="110" y1="335" x2="132" y2="380" stroke="#1e293b" stroke-width="2" />
    <text x="110" y="405" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">System Admin</text>
    <text x="110" y="423" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">(Quản trị viên nền tảng)</text>
  </g>

  <!-- Associations -->
  <line x1="138" y1="290" x2="310" y2="125" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="305" x2="305" y2="260" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="325" x2="310" y2="445" stroke="#1e293b" stroke-width="1.6" />
  <line x1="138" y1="340" x2="310" y2="540" stroke="#1e293b" stroke-width="1.6" />

  <!-- USE CASES -->
  <!-- 1. Platform Login -->
  <ellipse cx="390" cy="125" rx="88" ry="27" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="390" y="123" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Đăng nhập nền tảng</text>
  <text x="390" y="139" font-size="10.5" fill="#475569" text-anchor="middle">(Platform Login)</text>

  <!-- 2. Manage Organization (Main Use Case) -->
  <ellipse cx="390" cy="260" rx="92" ry="30" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="2" filter="url(#shadow)" />
  <text x="390" y="256" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Quản lý tổ chức</text>
  <text x="390" y="273" font-size="10.5" fill="#475569" text-anchor="middle">(Manage Organizations)</text>

  <!-- Sub UC: Create Org -->
  <ellipse cx="730" cy="140" rx="88" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="730" y="137" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Tạo tổ chức mới</text>
  <text x="730" y="152" font-size="10" fill="#475569" text-anchor="middle">(Create Organization)</text>

  <!-- Sub UC: View Org -->
  <ellipse cx="730" cy="210" rx="88" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="730" y="207" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Xem thông tin tổ chức</text>
  <text x="730" y="222" font-size="10" fill="#475569" text-anchor="middle">(View Org Details)</text>

  <!-- Sub UC: Update Org -->
  <ellipse cx="730" cy="280" rx="88" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="730" y="277" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Cập nhật tổ chức</text>
  <text x="730" y="292" font-size="10" fill="#475569" text-anchor="middle">(Update Org Profile)</text>

  <!-- Sub UC: Lock/Unlock Org -->
  <ellipse cx="730" cy="350" rx="88" ry="25" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="730" y="347" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Khóa / Mở tổ chức</text>
  <text x="730" y="362" font-size="10" fill="#475569" text-anchor="middle">(Lock / Unlock Org)</text>

  <!-- Sub UC: Provision Initial HR -->
  <ellipse cx="730" cy="425" rx="92" ry="26" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="730" y="422" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Cấp tài khoản HR đầu tiên</text>
  <text x="730" y="437" font-size="10" fill="#475569" text-anchor="middle">(Provision Initial HR)</text>

  <!-- <<include>> links from Manage Org -->
  <line x1="460" y1="240" x2="645" y2="155" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#openArrow)" />
  <text x="535" y="188" font-size="10" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="475" y1="250" x2="645" y2="220" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#openArrow)" />
  <text x="555" y="230" font-size="10" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="482" y1="265" x2="642" y2="278" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#openArrow)" />
  <text x="560" y="270" font-size="10" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="465" y1="278" x2="645" y2="410" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#openArrow)" />
  <text x="540" y="358" font-size="10" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>> Lock/Unlock Org -->
  <line x1="645" y1="345" x2="475" y2="280" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#openArrow)" />
  <text x="565" y="322" font-size="10" font-style="italic" fill="#0f172a" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- 3. Platform Audit Log -->
  <ellipse cx="390" cy="445" rx="88" ry="27" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="390" y="442" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Xem nhật ký nền tảng</text>
  <text x="390" y="458" font-size="10.5" fill="#475569" text-anchor="middle">(Platform Audit Log)</text>

  <!-- 4. Health & Status -->
  <ellipse cx="390" cy="540" rx="88" ry="27" fill="url(#ucGrad)" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="390" y="537" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Theo dõi sức khỏe hệ thống</text>
  <text x="390" y="553" font-size="10.5" fill="#475569" text-anchor="middle">(System Health &amp; Status)</text>

  <!-- Note box for Business Rule & Scope Isolation -->
  <g filter="url(#shadow)">
    <rect x="520" y="485" width="400" height="110" rx="8" fill="url(#noteGrad)" stroke="#ca8a04" stroke-width="1.5" />
    <text x="535" y="508" font-size="11.5" font-weight="800" fill="#854d0e">📌 RÀNG BUỘC PHẠM VI QUYỀN HẠN (SRS v4.0):</text>
    <text x="535" y="528" font-size="10.5" fill="#713f12">• System Admin không thuộc workforce của bất kỳ tenant nào.</text>
    <text x="535" y="546" font-size="10.5" fill="#713f12">• Không có tính năng check-in/out cá nhân.</text>
    <text x="535" y="564" font-size="10.5" fill="#713f12">• Tuyệt đối không xem dữ liệu lương, chấm công của tenant.</text>
    <text x="535" y="582" font-size="10.5" fill="#713f12">• Mọi thay đổi trạng thái Organization đều ghi nhận Audit Log.</text>
  </g>
</svg>
