<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">TimeLock System Context Diagram</title>
  <desc id="desc">DFD Level 0 context diagram showing TimeLock and external entities: System Admin, HR, Department Manager, Employee, and GPS/Network infrastructure.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 27px "Segoe UI", Inter, Arial, sans-serif; fill: #0f2b48; }
      .subtitle { font: 700 14px "Segoe UI", Inter, Arial, sans-serif; fill: #0284c7; letter-spacing: 1px; }
      .actor-title { font: 800 17px "Segoe UI", Inter, Arial, sans-serif; fill: #14532d; }
      .actor-subtitle { font: 600 13px "Segoe UI", Inter, Arial, sans-serif; fill: #166534; }
      .system-title { font: 900 26px "Segoe UI", Inter, Arial, sans-serif; fill: #ffffff; }
      .system-subtitle { font: 800 18px "Segoe UI", Inter, Arial, sans-serif; fill: #38bdf8; }
      .system-note { font: 600 13px "Segoe UI", Inter, Arial, sans-serif; fill: #dbeafe; }
      .label-text { font: 650 12.5px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .footer { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; }
      .actor-box { fill: #dcfce7; stroke: #22c55e; stroke-width: 2.4; }
      .label-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .flow { fill: none; stroke: #1e293b; stroke-width: 2.2; }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 5; }
    </style>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b" />
    </marker>

    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13" />
    </filter>
  </defs>

  <rect class="bg" width="1200" height="760" />

  <text class="title" x="600" y="42" text-anchor="middle">TimeLock - Employee Attendance &amp; Timesheet Closing System</text>
  <text class="subtitle" x="600" y="68" text-anchor="middle">SƠ ĐỒ NGỮ CẢNH HỆ THỐNG - DFD LEVEL 0</text>

  <path class="guide" d="M 600 160 L 600 250" />
  <path class="guide" d="M 370 260 L 485 325" />
  <path class="guide" d="M 830 260 L 715 325" />
  <path class="guide" d="M 370 548 L 485 435" />
  <path class="guide" d="M 830 548 L 715 435" />

  <path class="flow" d="M 552 162 L 552 245" marker-end="url(#arrowhead)" />
  <path class="flow" d="M 648 245 L 648 162" marker-end="url(#arrowhead)" />

  <path class="flow" d="M 370 250 L 488 315" marker-end="url(#arrowhead)" />
  <path class="flow" d="M 485 346 L 370 282" marker-end="url(#arrowhead)" />

  <path class="flow" d="M 830 250 L 712 315" marker-end="url(#arrowhead)" />
  <path class="flow" d="M 715 346 L 830 282" marker-end="url(#arrowhead)" />

  <path class="flow" d="M 370 550 L 488 440" marker-end="url(#arrowhead)" />
  <path class="flow" d="M 485 410 L 370 520" marker-end="url(#arrowhead)" />

  <path class="flow" d="M 830 550 L 712 440" marker-end="url(#arrowhead)" />
  <path class="flow" d="M 715 410 L 830 520" marker-end="url(#arrowhead)" />

  <g filter="url(#shadow)">
    <rect class="label-box" x="398" y="182" width="155" height="50" rx="7" />
    <text class="label-text" x="475.5" y="202" text-anchor="middle">
      <tspan x="475.5" dy="0">Tạo Organization</tspan>
      <tspan x="475.5" dy="17">và tài khoản HR</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="647" y="182" width="155" height="50" rx="7" />
    <text class="label-text" x="724.5" y="202" text-anchor="middle">
      <tspan x="724.5" dy="0">Audit log</tspan>
      <tspan x="724.5" dy="17">và trạng thái</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="285" y="300" width="175" height="54" rx="7" />
    <text class="label-text" x="372.5" y="320" text-anchor="middle">
      <tspan x="372.5" dy="0">Tọa độ GPS</tspan>
      <tspan x="372.5" dy="17">IP / WiFi BSSID</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="285" y="392" width="175" height="54" rx="7" />
    <text class="label-text" x="372.5" y="412" text-anchor="middle">
      <tspan x="372.5" dy="0">Xác minh Geofence</tspan>
      <tspan x="372.5" dy="17">và CIDR</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="740" y="300" width="190" height="54" rx="7" />
    <text class="label-text" x="835" y="320" text-anchor="middle">
      <tspan x="835" dy="0">Cấu hình ca</tspan>
      <tspan x="835" dy="17">Geofence, chốt kỳ</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="740" y="392" width="190" height="54" rx="7" />
    <text class="label-text" x="835" y="412" text-anchor="middle">
      <tspan x="835" dy="0">Bảng công tổ chức</tspan>
      <tspan x="835" dy="17">Export CSV/XLSX</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="285" y="458" width="175" height="54" rx="7" />
    <text class="label-text" x="372.5" y="478" text-anchor="middle">
      <tspan x="372.5" dy="0">Bảng công cá nhân</tspan>
      <tspan x="372.5" dy="17">Kết quả duyệt</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="285" y="592" width="175" height="54" rx="7" />
    <text class="label-text" x="372.5" y="612" text-anchor="middle">
      <tspan x="372.5" dy="0">Check-in/out</tspan>
      <tspan x="372.5" dy="17">Selfie, giải trình</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="740" y="458" width="190" height="54" rx="7" />
    <text class="label-text" x="835" y="478" text-anchor="middle">
      <tspan x="835" dy="0">DS chờ duyệt</tspan>
      <tspan x="835" dy="17">Bảng công PB</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="label-box" x="740" y="592" width="190" height="54" rx="7" />
    <text class="label-text" x="835" y="612" text-anchor="middle">
      <tspan x="835" dy="0">Duyệt Selfie</tspan>
      <tspan x="835" dy="17">Đổi ca, khóa PB</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="600" cy="380" r="125" fill="#1e293b" />
    <circle cx="600" cy="380" r="114" fill="#334155" />
    <text class="system-title" x="600" y="350" text-anchor="middle">TimeLock</text>
    <text class="system-subtitle" x="600" y="378" text-anchor="middle">Management System</text>
    <line x1="525" y1="398" x2="675" y2="398" stroke="#64748b" stroke-width="1.6" />
    <text class="system-note" x="600" y="422" text-anchor="middle">Chấm công · Phê duyệt</text>
    <text class="system-note" x="600" y="444" text-anchor="middle">Chốt kỳ &amp; Báo cáo</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="actor-box" x="452.5" y="92" width="295" height="70" rx="9" />
    <text class="actor-title" x="600" y="122" text-anchor="middle">Quản trị viên hệ thống</text>
    <text class="actor-subtitle" x="600" y="145" text-anchor="middle">(System Admin)</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="actor-box" x="70" y="222" width="300" height="74" rx="9" />
    <text class="actor-title" x="220" y="253" text-anchor="middle">Hạ tầng GPS / Network</text>
    <text class="actor-subtitle" x="220" y="277" text-anchor="middle">(Location &amp; WiFi Provider)</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="actor-box" x="830" y="222" width="300" height="74" rx="9" />
    <text class="actor-title" x="980" y="253" text-anchor="middle">Nhân sự</text>
    <text class="actor-subtitle" x="980" y="277" text-anchor="middle">(HR / Timekeeping Officer)</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="actor-box" x="70" y="520" width="300" height="74" rx="9" />
    <text class="actor-title" x="220" y="551" text-anchor="middle">Nhân viên</text>
    <text class="actor-subtitle" x="220" y="575" text-anchor="middle">(Employee)</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="actor-box" x="830" y="520" width="300" height="74" rx="9" />
    <text class="actor-title" x="980" y="551" text-anchor="middle">Quản lý phòng ban</text>
    <text class="actor-subtitle" x="980" y="575" text-anchor="middle">(Department Manager)</text>
  </g>

  <line x1="40" y1="710" x2="1160" y2="710" stroke="#059669" stroke-width="2" />
  <text class="footer" x="48" y="735" fill="#047857">TimeLock Architecture</text>
  <text class="footer" x="1152" y="735" fill="#64748b" text-anchor="end">DFD Level 0 Context Model</text>
</svg>
